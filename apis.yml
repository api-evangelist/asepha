aid: asepha
name: Asepha
description: >-
  Asepha is an AI workflow automation platform built specifically for pharmacies,
  positioning itself as "the context graph for the therapy-start journey" with a stated
  vision to make medication delays impossible. Its AI agents automate repetitive pharmacy
  operations across automated prescription data entry, back-office work, 340B management
  (TPA matching, accruals, purchase-order automation), medication reconciliation (Best
  Possible Medication History), a conversational voice call assistant, benefits
  verification and prior-authorization (BV/PA) automation, REMS compliance reporting, and
  medication therapy review. The company reports outcomes such as a 32% reduction in
  manual labour cost within one month and tasks completed 4x faster than baseline. Asepha
  is SOC 2 Type 2 certified and HIPAA compliant, with AES-256 encryption at rest. Founded
  by CEO Eunice Wu, PharmD and CTO Can Uncu, the company operates from New York, NY and
  Toronto, ON, and is a Techstars portfolio company. This profile is maintained in the API
  Evangelist network; Asepha publishes no public API, developer portal, or specifications
  at this time.
